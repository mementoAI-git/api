# ──────────────────────────────────────────────────────────────
# Backend — Deploy to Development
#
# Push to dev:
#   1. Install once in CI
#   2. Lint
#   3. Test
#   4. Build
#   5. Create immutable deployment artifact
#   6. Upload inactive release
#   7. Install production dependencies
#   8. Provision Yarn + PM2 for the release's Node version
#   9. Atomically activate release
#  10. Reload PM2
#  11. Health check
#  12. Roll back automatically on failure
#  13. Keep current + previous healthy release only
#
# Server layout:
#
# /opt/memento/backend-dev/
#   current -> releases/<release-id>
#   build -> current/build
#   node_modules -> current/node_modules
#   package.json -> current/package.json
#   yarn.lock -> current/yarn.lock
#   ecosystem.config.js -> current/ecosystem.config.js
#   .nvmrc -> current/.nvmrc
#   releases/
# ──────────────────────────────────────────────────────────────

name: 'Backend: Deploy Dev'

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  DEPLOY_ROOT: /opt/memento/backend-dev
  READINESS_URL: http://127.0.0.1:3001/ready

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Lint, Test and Build, side by side
  #
  # Private-repo runners have 2 CPUs, so one job ran the test
  # files one at a time (~3 min). Lint, three test shards and
  # the build now run in parallel jobs; deploy waits for all.
  #
  # It is safe to cancel obsolete runs because they have not
  # touched the server yet.
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Contract
    runs-on: ubuntu-latest

    concurrency:
      group: backend-lint-dev
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Verify API contract artifact
        run: yarn contracts:check

  test:
    name: Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]

    concurrency:
      group: backend-test-dev-${{ matrix.shard }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Two workers on the 2-CPU runner: the tests mostly wait on
      # the in-memory database, so both CPUs stay busy.
      - name: Run tests
        run: yarn test --shard=${{ matrix.shard }}/3 --maxWorkers=2

  build:
    name: Build
    runs-on: ubuntu-latest

    concurrency:
      group: backend-build-dev
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "build" ]; then
            echo "::error::Build directory is missing"
            exit 1
          fi

          if [ -z "$(find build -type f -print -quit)" ]; then
            echo "::error::Build directory is empty"
            exit 1
          fi

          FILE_COUNT="$(find build -type f | wc -l | tr -d ' ')"
          echo "Build output OK — ${FILE_COUNT} files"

      # Build an explicit runtime artifact rather than deploying
      # the repository directly.
      #
      # Remove the application's postinstall hook because the
      # TypeScript application has already been compiled in CI.
      #
      # Dependency package install scripts remain enabled later.
      - name: Prepare deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp -a build release/build
          cp package.json release/package.json
          cp yarn.lock release/yarn.lock
          cp ecosystem.config.js release/ecosystem.config.js
          cp .nvmrc release/.nvmrc
          cp .npmrc release/.npmrc
          cp openapi.json release/openapi.json
          cp openapi.sha256 release/openapi.sha256

          node <<'NODE'
          const fs = require('fs');

          const file = 'release/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (pkg.scripts?.postinstall) {
            console.log(
              `Removing application postinstall from deployment artifact: ${pkg.scripts.postinstall}`
            );

            delete pkg.scripts.postinstall;
          }

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + '\n'
          );
          NODE

          echo "Deployment artifact prepared:"
          find release -maxdepth 2 -type f | sort

      # Artifacts count against the account's storage quota; the Actions cache does not.
      - name: Save deployment bundle
        uses: actions/cache/save@v4
        with:
          key: backend-dev-${{ github.sha }}-${{ github.run_id }}
          path: release/

  # ────────────────────────────────────────────────────────────
  # 2. Deploy
  #
  # Never cancel a deployment once it starts touching the
  # server.
  #
  # If several commits arrive rapidly, GitHub keeps the running
  # deploy and the newest pending deploy.
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    environment: development

    concurrency:
      group: backend-deploy-dev
      cancel-in-progress: false

    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}

      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Restore deployment bundle
        uses: actions/cache/restore@v4
        with:
          key: backend-dev-${{ github.sha }}-${{ github.run_id }}
          path: release/
          fail-on-cache-miss: true

      # ────────────────────────────────────────────────────────
      # SSH
      # ────────────────────────────────────────────────────────
      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          [ -n "$SSH_HOST" ] || {
            echo "::error::DEPLOY_SSH_HOST is missing"
            exit 1
          }

          [ -n "$SSH_USER" ] || {
            echo "::error::DEPLOY_SSH_USER is missing"
            exit 1
          }

          [ -n "$SSH_PRIVATE_KEY" ] || {
            echo "::error::DEPLOY_SSH_KEY is missing"
            exit 1
          }

          [ -n "$SSH_KNOWN_HOSTS" ] || {
            echo "::error::DEPLOY_SSH_KNOWN_HOSTS is missing"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connection
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection OK'"

      # ────────────────────────────────────────────────────────
      # PostHog settings: GitHub secrets -> server .env.
      # The values go to the server inside the stdin script, never
      # on a command line. The apps read them when the release is
      # activated below.
      # ────────────────────────────────────────────────────────
      - name: Sync PostHog settings
        shell: bash
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_IDENTITY_SECRET: ${{ secrets.POSTHOG_IDENTITY_SECRET_DEV }}
        run: |
          set -euo pipefail

          if [ -z "$POSTHOG_PROJECT_TOKEN" ] \
            || [ -z "$POSTHOG_HOST" ] \
            || [ -z "$POSTHOG_IDENTITY_SECRET" ]; then
            echo "::warning::PostHog secrets are not all set; the development .env was left unchanged."
            exit 0
          fi

          # Strict formats keep the values safe to embed in the script.
          if ! [[ "$POSTHOG_PROJECT_TOKEN" =~ ^phc_[A-Za-z0-9]+$ ]]; then
            echo "::error::POSTHOG_PROJECT_TOKEN must look like phc_..."
            exit 1
          fi
          if ! [[ "$POSTHOG_HOST" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::POSTHOG_HOST must be a bare https origin"
            exit 1
          fi
          if ! [[ "$POSTHOG_IDENTITY_SECRET" =~ ^[A-Za-z0-9]{32,}$ ]]; then
            echo "::error::POSTHOG_IDENTITY_SECRET_DEV must be 32+ letters or digits"
            exit 1
          fi

          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_ROOT/.env'" <<REMOTE
          set -euo pipefail
          ENV_FILE="\$1"
          if [ ! -f "\$ENV_FILE" ]; then
            echo "::error::\$ENV_FILE does not exist"
            exit 1
          fi
          TMP="\$(mktemp "\$ENV_FILE.XXXXXX")"
          trap 'rm -f "\$TMP"' EXIT
          grep -v -E '^(export )?POSTHOG_(PROJECT_TOKEN|HOST|IDENTITY_SECRET)=' \
            "\$ENV_FILE" > "\$TMP" || true
          {
            echo 'POSTHOG_PROJECT_TOKEN=$POSTHOG_PROJECT_TOKEN'
            echo 'POSTHOG_HOST=$POSTHOG_HOST'
            echo 'POSTHOG_IDENTITY_SECRET=$POSTHOG_IDENTITY_SECRET'
          } >> "\$TMP"
          if cmp -s "\$TMP" "\$ENV_FILE"; then
            echo "PostHog settings are already current."
            exit 0
          fi
          chmod --reference="\$ENV_FILE" "\$TMP"
          mv -f "\$TMP" "\$ENV_FILE"
          trap - EXIT
          echo "PostHog settings written to \$ENV_FILE."
          REMOTE

      # ────────────────────────────────────────────────────────
      # Upload inactive release
      # ────────────────────────────────────────────────────────
      - name: Create release directory
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_ROOT/releases/$RELEASE_ID'"

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail

          rsync \
            -az \
            --delete \
            -e "ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -i ~/.ssh/deploy_key \
              -p $SSH_PORT" \
            ./release/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/releases/$RELEASE_ID/"

      # ────────────────────────────────────────────────────────
      # Prepare runtime BEFORE activating anything.
      #
      # If this fails, the current live release is untouched.
      # ────────────────────────────────────────────────────────
      - name: Prepare release runtime
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail

          RELEASE_ID="$1"

          DEPLOY_ROOT="/opt/memento/backend-dev"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"

          cd "$RELEASE_DIR"

          if [ ! -f ".nvmrc" ]; then
            echo "ERROR: Release is missing .nvmrc"
            exit 1
          fi

          export NVM_DIR="$HOME/.nvm"

          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "ERROR: NVM is not installed for the deploy user"
            exit 1
          fi

          # nvm itself is not fully compatible with `set -u`.
          set +u
          . "$NVM_DIR/nvm.sh"

          if ! nvm install; then
            echo "ERROR: Unable to install Node version from .nvmrc"
            exit 1
          fi

          if ! nvm use; then
            echo "ERROR: Unable to activate Node version from .nvmrc"
            exit 1
          fi

          set -u

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"

          # Verify the deployment copy cannot accidentally rebuild
          # TypeScript source on the server.
          POSTINSTALL="$(
            node -e "
              const p = require('./package.json');
              process.stdout.write(p.scripts?.postinstall || '');
            "
          )"

          if [ -n "$POSTINSTALL" ]; then
            echo "ERROR: Deployment package.json contains postinstall:"
            echo "  $POSTINSTALL"
            exit 1
          fi

          # ── Yarn Classic ───────────────────────────────────
          YARN_VERSION="$(yarn --version 2>/dev/null || true)"

          case "$YARN_VERSION" in
            1.*)
              echo "Yarn: $YARN_VERSION"
              ;;

            *)
              echo "Installing Yarn Classic..."
              npm install --global yarn@1.22.22 --force
              echo "Yarn: $(yarn --version)"
              ;;
          esac

          # ── Runtime dependencies ───────────────────────────
          #
          # Application code was already compiled in CI.
          # Dependency install scripts are still allowed.
          yarn install \
            --production \
            --frozen-lockfile

          # ── PM2 ────────────────────────────────────────────
          #
          # NVM keeps global npm packages per Node installation.
          # A new Node version therefore needs PM2 installed for
          # that Node version too.
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "PM2 unavailable for $(node --version)"
            echo "Installing PM2..."

            npm install --global pm2
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "ERROR: PM2 unavailable after installation"
            exit 1
          fi

          echo "PM2 executable: $(command -v pm2)"

          echo "Release runtime prepared successfully."
          REMOTE

      # ────────────────────────────────────────────────────────
      # Atomic activation + rollback
      # ────────────────────────────────────────────────────────
      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail

          RELEASE_ID="$1"

          DEPLOY_ROOT="/opt/memento/backend-dev"
          RELEASES="$DEPLOY_ROOT/releases"
          CURRENT="$DEPLOY_ROOT/current"
          NEW_RELEASE="$RELEASES/$RELEASE_ID"

          API_APP="memento-backend-dev"
          WORKER_APP="memento-backend-dev-worker"

          READINESS_URL="http://127.0.0.1:3001/ready"

          mkdir -p "$RELEASES"

          if [ ! -d "$NEW_RELEASE" ]; then
            echo "ERROR: New release does not exist:"
            echo "  $NEW_RELEASE"
            exit 1
          fi

          # ────────────────────────────────────────────────────
          # Helpers
          # ────────────────────────────────────────────────────
          load_nvm() {
            export NVM_DIR="$HOME/.nvm"

            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "ERROR: NVM is unavailable"
              return 1
            fi

            set +u
            . "$NVM_DIR/nvm.sh"
            set -u
          }

          use_release_node() {
            RELEASE_DIR="$1"

            load_nvm || return 1

            OLD_PWD="$PWD"
            cd "$RELEASE_DIR"

            if [ -f ".nvmrc" ]; then
              echo "Selecting Node from:"
              echo "  $RELEASE_DIR/.nvmrc"

              set +u

              if nvm use; then
                NVM_OK=1
              else
                NVM_OK=0
              fi

              set -u

              if [ "$NVM_OK" -ne 1 ]; then
                cd "$OLD_PWD"
                echo "ERROR: Unable to select release Node version"
                return 1
              fi

            else
              # Legacy migration releases may not contain
              # .nvmrc. Use the new release's Node version as
              # the PM2 control runtime in that situation.
              echo "WARNING: Release has no .nvmrc:"
              echo "  $RELEASE_DIR"
              echo "Using deployment Node as PM2 control runtime."

              cd "$NEW_RELEASE"

              set +u

              if nvm use >/dev/null 2>&1; then
                NVM_OK=1
              else
                NVM_OK=0
              fi

              set -u

              if [ "$NVM_OK" -ne 1 ]; then
                cd "$OLD_PWD"
                echo "ERROR: Unable to select deployment Node"
                return 1
              fi
            fi

            cd "$OLD_PWD"

            # A historical release may reference a Node version
            # where PM2 was never installed. Fall back to the new
            # release's Node version, where Prepare runtime has
            # already guaranteed PM2 exists.
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 unavailable under selected Node."
              echo "Using deployment Node as PM2 control runtime."

              cd "$NEW_RELEASE"

              set +u

              if nvm use >/dev/null 2>&1; then
                NVM_OK=1
              else
                NVM_OK=0
              fi

              set -u

              cd "$OLD_PWD"

              if [ "$NVM_OK" -ne 1 ]; then
                echo "ERROR: Could not select deployment Node"
                return 1
              fi
            fi

            if ! command -v node >/dev/null 2>&1; then
              echo "ERROR: Node is unavailable"
              return 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: PM2 is unavailable"
              return 1
            fi

            echo "Control Node: $(node --version)"
            echo "PM2: $(command -v pm2)"
          }

          switch_release() {
            TARGET="$1"

            if [ ! -d "$TARGET" ]; then
              echo "ERROR: Cannot switch to missing release:"
              echo "  $TARGET"
              return 1
            fi

            rm -f "$DEPLOY_ROOT/.current-next"

            ln -s \
              "$TARGET" \
              "$DEPLOY_ROOT/.current-next"

            # Atomic rename on the same filesystem.
            mv -Tf \
              "$DEPLOY_ROOT/.current-next" \
              "$CURRENT"
          }

          reload_apps() {
            cd "$DEPLOY_ROOT"

            echo "Reloading API..."

            MEMENTO_ENV=dev \
              pm2 startOrReload \
              "$DEPLOY_ROOT/ecosystem.config.js" \
              --only "$API_APP" \
              --update-env

            echo "Reloading worker..."

            MEMENTO_ENV=dev \
              pm2 startOrReload \
              "$DEPLOY_ROOT/ecosystem.config.js" \
              --only "$WORKER_APP" \
              --update-env

            pm2 save

            echo "PM2 reload completed."
          }

          run_release_migrations() {
            echo "Running release database migrations..."
            cd "$NEW_RELEASE"
            MIGRATION_STATUS=0
            DOTENV_CONFIG_PATH="$DEPLOY_ROOT/.env" \
              NODE_ENV=production \
              MEMENTO_ENV=dev \
              npm run migrations:up:prod || MIGRATION_STATUS=$?
            cd "$DEPLOY_ROOT"
            return "$MIGRATION_STATUS"
          }

          check_readiness() {
            LABEL="$1"
            ATTEMPTS="${2:-15}"
            ALLOW_LEGACY_HEALTH="${3:-0}"

            echo "Checking ${LABEL}..."

            for attempt in $(seq 1 "$ATTEMPTS"); do
              READINESS_STATUS="$(curl \
                --silent \
                --max-time 5 \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$READINESS_URL" \
                2>/dev/null || true)"

              case "$READINESS_STATUS" in
              2??)
                echo "${LABEL} passed on attempt ${attempt}"
                return 0
                ;;
              esac

              if [ "$ALLOW_LEGACY_HEALTH" = "1" ] && \
                { [ "$READINESS_STATUS" = "404" ] || \
                  [ "$READINESS_STATUS" = "405" ]; } && curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                "${READINESS_URL%/ready}/health" \
                >/dev/null 2>&1
              then
                echo "${LABEL} passed via legacy health endpoint on attempt ${attempt}"
                return 0
              fi

              echo "${LABEL} attempt ${attempt} failed"
              sleep 2
            done

            echo "${LABEL} failed"
            return 1
          }

          # ────────────────────────────────────────────────────
          # One-time migration from the old in-place deployment
          # ────────────────────────────────────────────────────
          if [ ! -L "$CURRENT" ]; then
            if [ -e "$CURRENT" ]; then
              echo "ERROR: $CURRENT exists but is not a symlink"
              exit 1
            fi

            LEGACY_RELEASE="$RELEASES/legacy-$(date +%Y%m%d-%H%M%S)"
            LEGACY_FOUND=0

            mkdir -p "$LEGACY_RELEASE"

            for item in \
              build \
              node_modules \
              package.json \
              yarn.lock \
              ecosystem.config.js \
              .nvmrc
            do
              if [ -e "$DEPLOY_ROOT/$item" ] || \
                 [ -L "$DEPLOY_ROOT/$item" ]; then

                mv \
                  "$DEPLOY_ROOT/$item" \
                  "$LEGACY_RELEASE/$item"

                LEGACY_FOUND=1
              fi
            done

            if [ "$LEGACY_FOUND" -eq 1 ]; then
              echo "Migrated existing deployment to:"
              echo "  $LEGACY_RELEASE"

              ln -s \
                "$LEGACY_RELEASE" \
                "$CURRENT"
            else
              echo "No existing deployment found."
              rmdir "$LEGACY_RELEASE"
            fi

            ln -sfn \
              "current/build" \
              "$DEPLOY_ROOT/build"

            ln -sfn \
              "current/node_modules" \
              "$DEPLOY_ROOT/node_modules"

            ln -sfn \
              "current/package.json" \
              "$DEPLOY_ROOT/package.json"

            ln -sfn \
              "current/yarn.lock" \
              "$DEPLOY_ROOT/yarn.lock"

            ln -sfn \
              "current/ecosystem.config.js" \
              "$DEPLOY_ROOT/ecosystem.config.js"

            ln -sfn \
              "current/.nvmrc" \
              "$DEPLOY_ROOT/.nvmrc"
          fi

          # Validate the migrated/current structure.
          if [ ! -L "$CURRENT" ]; then
            echo "ERROR: current is not a symlink"
            exit 1
          fi

          if [ ! -L "$DEPLOY_ROOT/build" ]; then
            echo "ERROR: build compatibility symlink is missing"
            exit 1
          fi

          if [ ! -L "$DEPLOY_ROOT/ecosystem.config.js" ]; then
            echo "ERROR: ecosystem.config.js compatibility symlink is missing"
            exit 1
          fi

          PREVIOUS_RELEASE="$(
            readlink -f "$CURRENT" || true
          )"

          echo
          echo "Previous release:"
          echo "  ${PREVIOUS_RELEASE:-none}"

          echo "New release:"
          echo "  $NEW_RELEASE"

          # The currently-running release is known-good enough to
          # be serving traffic, so mark it healthy.
          #
          # This also migrates deployments created before the
          # .healthy-marker system.
          if [ -n "$PREVIOUS_RELEASE" ] && \
             [ -d "$PREVIOUS_RELEASE" ]; then

            touch "$PREVIOUS_RELEASE/.healthy"
          fi

          PM2_RELOAD_ATTEMPTED=0

          rollback() {
            echo
            echo "Development deployment failed."

            if [ -z "$PREVIOUS_RELEASE" ]; then
              echo "ERROR: No previous release is available."
              return 1
            fi

            if [ ! -d "$PREVIOUS_RELEASE" ]; then
              echo "ERROR: Previous release no longer exists:"
              echo "  $PREVIOUS_RELEASE"
              return 1
            fi

            echo "Restoring previous release:"
            echo "  $PREVIOUS_RELEASE"

            if ! switch_release "$PREVIOUS_RELEASE"; then
              echo "ERROR: Failed restoring previous symlink."
              return 1
            fi

            # If PM2 was never touched, the previous processes
            # are still running. Do not unnecessarily restart
            # them.
            if [ "$PM2_RELOAD_ATTEMPTED" -eq 0 ]; then
              echo "PM2 was never modified."
              echo "Existing processes remain running."
              echo "Symlink rollback completed."
              return 0
            fi

            echo "PM2 was modified; restoring previous processes."

            if ! use_release_node "$PREVIOUS_RELEASE"; then
              echo "ERROR: Symlink restored, but PM2 control failed."
              return 1
            fi

            if ! reload_apps; then
              echo "ERROR: Symlink restored, but PM2 rollback failed."
              return 1
            fi

            if ! check_readiness "Rollback readiness check" 10 1; then
              echo "ERROR: Previous release is still not ready."
              return 1
            fi

            echo "Rollback completed successfully."
          }

          # ────────────────────────────────────────────────────
          # Activate new release
          # ────────────────────────────────────────────────────
          echo
          echo "Activating new release..."

          # PM2 was guaranteed to exist for this Node version
          # during Prepare release runtime.
          if ! use_release_node "$NEW_RELEASE"; then
            exit 1
          fi

          if ! run_release_migrations; then
            echo "ERROR: Release database migrations failed"
            exit 1
          fi

          if ! switch_release "$NEW_RELEASE"; then
            echo "ERROR: Unable to activate new release"
            exit 1
          fi

          # Mark before invoking PM2 because startOrReload could
          # partially modify one process and then fail.
          PM2_RELOAD_ATTEMPTED=1

          if ! reload_apps; then
            rollback || true
            exit 1
          fi

          if ! check_readiness "New release readiness check" 15; then
            rollback || true
            exit 1
          fi

          # Only a release that passed its readiness check receives
          # this marker.
          touch "$NEW_RELEASE/.healthy"

          echo
          echo "Deployment successful."
          echo "Active release:"
          echo "  $NEW_RELEASE"

          # Growth analytics settings: warn (never fail) when PostHog
          # tracking is off or mis-tagged, so signups can't go missing silently.
          (
            cd "$NEW_RELEASE" &&
              DOTENV_CONFIG_PATH="$DEPLOY_ROOT/.env" \
              NODE_ENV=production \
              MEMENTO_ENV=dev \
              node build/src/scripts/growth-analytics/check-config.js --github
          ) || echo "::warning::Could not check growth analytics settings"

          # ────────────────────────────────────────────────────
          # Release cleanup
          #
          # 1. Delete failed/incomplete normal releases.
          # 2. Keep only TWO healthy normal releases:
          #      - current
          #      - previous
          #
          # Legacy migration release is retained separately for
          # now.
          # ────────────────────────────────────────────────────
          ACTIVE_RELEASE="$(
            readlink -f "$CURRENT" || true
          )"

          echo
          echo "Removing failed/incomplete releases..."

          for candidate in "$RELEASES"/*; do
            [ -d "$candidate" ] || continue

            NAME="$(basename "$candidate")"

            case "$NAME" in
              legacy-*)
                continue
                ;;
            esac

            if [ "$candidate" = "$ACTIVE_RELEASE" ]; then
              continue
            fi

            if [ ! -f "$candidate/.healthy" ]; then
              echo "Removing unhealthy/incomplete release:"
              echo "  $candidate"

              rm -rf "$candidate"
            fi
          done

          echo
          echo "Keeping newest 2 healthy releases..."

          mapfile -t HEALTHY_RELEASES < <(
            for candidate in "$RELEASES"/*; do
              [ -d "$candidate" ] || continue

              NAME="$(basename "$candidate")"

              case "$NAME" in
                legacy-*)
                  continue
                  ;;
              esac

              [ -f "$candidate/.healthy" ] || continue

              printf '%s %s\n' \
                "$(stat -c '%Y' "$candidate")" \
                "$candidate"
            done |
              sort -rn |
              cut -d' ' -f2-
          )

          if [ "${#HEALTHY_RELEASES[@]}" -gt 2 ]; then
            for old_release in "${HEALTHY_RELEASES[@]:2}"; do
              if [ "$old_release" = "$ACTIVE_RELEASE" ]; then
                continue
              fi

              echo "Removing old healthy release:"
              echo "  $old_release"

              rm -rf "$old_release"
            done
          fi

          echo
          echo "Remaining releases:"
          du -sh "$RELEASES"/* 2>/dev/null || true
          REMOTE

      # ────────────────────────────────────────────────────────
      # If any deployment step failed, remove the newly-created
      # release as long as it is NOT the active release.
      #
      # This handles failures during:
      #   - upload
      #   - yarn install
      #   - PM2 provisioning
      #   - activation followed by successful rollback
      # ────────────────────────────────────────────────────────
      - name: Cleanup failed release
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ~/.ssh/deploy_key ]; then
            echo "SSH was not initialized; nothing to clean remotely."
            exit 0
          fi

          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail

          RELEASE_ID="$1"

          DEPLOY_ROOT="/opt/memento/backend-dev"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"
          CURRENT="$DEPLOY_ROOT/current"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Failed release is already absent."
            exit 0
          fi

          ACTIVE_RELEASE="$(
            readlink -f "$CURRENT" 2>/dev/null || true
          )"

          RELEASE_PATH="$(
            readlink -f "$RELEASE_DIR" 2>/dev/null || true
          )"

          if [ -n "$RELEASE_PATH" ] && \
             [ "$RELEASE_PATH" = "$ACTIVE_RELEASE" ]; then

            echo "Failed release is still active."
            echo "Refusing to delete:"
            echo "  $RELEASE_DIR"

            exit 0
          fi

          echo "Removing failed inactive release:"
          echo "  $RELEASE_DIR"

          rm -rf "$RELEASE_DIR"
          REMOTE

      # Always last among SSH-using steps.
      - name: Cleanup SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/known_hosts

  # ────────────────────────────────────────────────────────────
  # 3. Notification
  #
  # Separate job means lint/build failures are reported too.
  # ────────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs:
      - lint
      - test
      - build
      - deploy

    if: ${{ always() }}

    runs-on: ubuntu-latest
    environment: development

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # The first of lint, test and build that did not succeed.
      BUILD_RESULT: ${{ (needs.lint.result != 'success' && needs.lint.result) || (needs.test.result != 'success' && needs.test.result) || needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}

      COMMIT_SHA: ${{ github.sha }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      BRANCH: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}

      SERVER_URL: ${{ github.server_url }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Discord notification
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping."
            exit 0
          fi

          # Obsolete builds can intentionally be cancelled by a
          # newer dev commit. Do not spam Discord for those.
          if [ "$BUILD_RESULT" = "cancelled" ]; then
            echo "Build superseded by newer commit; skipping notification."
            exit 0
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          FIRST_LINE="${COMMIT_MSG%%$'\n'*}"
          FIRST_LINE="${FIRST_LINE:0:900}"

          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          COMMIT_URL="${SERVER_URL}/${REPOSITORY}/commit/${COMMIT_SHA}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="✅ Dev Deploy Succeeded"
            COLOR=3066993
            STATUS="Success"

          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            echo "Deploy superseded before activation; skipping notification."
            exit 0

          elif [ "$BUILD_RESULT" = "failure" ]; then
            TITLE="❌ Dev Build Failed"
            COLOR=15158332
            STATUS="Build failed"

          else
            TITLE="❌ Dev Deploy Failed"
            COLOR=15158332
            STATUS="Deploy failed"
          fi

          PAYLOAD="$(
            jq -n \
              --arg title "$TITLE" \
              --argjson color "$COLOR" \
              --arg status "$STATUS" \
              --arg branch "$BRANCH" \
              --arg sha "$SHORT_SHA" \
              --arg commit_url "$COMMIT_URL" \
              --arg message "$FIRST_LINE" \
              --arg actor "$ACTOR" \
              --arg run_url "$RUN_URL" \
              --arg build "$BUILD_RESULT" \
              --arg deploy "$DEPLOY_RESULT" \
              --arg timestamp "$TIMESTAMP" \
              '{
                embeds: [{
                  title: $title,
                  color: $color,
                  fields: [
                    {
                      name: "Environment",
                      value: "Development",
                      inline: true
                    },
                    {
                      name: "Status",
                      value: $status,
                      inline: true
                    },
                    {
                      name: "Branch",
                      value: ("`" + $branch + "`"),
                      inline: true
                    },
                    {
                      name: "Commit",
                      value: (
                        "[`" + $sha + "`](" +
                        $commit_url +
                        ")"
                      ),
                      inline: true
                    },
                    {
                      name: "Message",
                      value: $message,
                      inline: false
                    },
                    {
                      name: "Triggered by",
                      value: $actor,
                      inline: true
                    },
                    {
                      name: "Workflow",
                      value: (
                        "[View run](" +
                        $run_url +
                        ")"
                      ),
                      inline: true
                    },
                    {
                      name: "Pipeline",
                      value: (
                        "Build: `" + $build +
                        "`\nDeploy: `" + $deploy +
                        "`"
                      ),
                      inline: false
                    }
                  ],
                  timestamp: $timestamp
                }]
              }'
          )"

          curl \
            --fail \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" \
            || true
