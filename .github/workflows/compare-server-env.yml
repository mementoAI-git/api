name: 'Backend: Compare dev and prod settings'

# Prints the API settings that differ between the dev and prod servers.
# Behaviour settings show their values; keys, URLs and IDs only show whether
# they are set, so nothing secret reaches the log. Run it by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Compare settings
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- /opt/memento/backend-dev/.env /opt/memento/backend-prod/.env" \
            < scripts/compare-server-env.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key
