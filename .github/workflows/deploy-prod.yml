# ──────────────────────────────────────────────────────────────
# Backend — Deploy to Production
#
# Manual trigger only.
# Requires typing exactly: DEPLOY
# Production branch: main
#
# Flow:
#   1. Validate exact confirmation + branch
#   2. Install dependencies once in CI
#   3. Lint + test + build
#   4. Create deployment artifact
#      - strips application postinstall compile hook
#   5. Upload immutable release
#   6. Install runtime dependencies in inactive release
#   7. Ensure Node / Yarn / PM2 are available
#   8. Atomically switch current symlink
#   9. Reload PM2
#  10. Health check
#  11. Automatically roll back on failure
#
# Server layout:
#
# /opt/memento/backend-prod/
#   current -> releases/<release-id>
#   build -> current/build
#   node_modules -> current/node_modules
#   package.json -> current/package.json
#   yarn.lock -> current/yarn.lock
#   ecosystem.config.js -> current/ecosystem.config.js
#   .nvmrc -> current/.nvmrc
#   releases/
# ──────────────────────────────────────────────────────────────

name: 'Backend: Deploy Prod'

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly "DEPLOY" to confirm production deployment'
        required: true
        type: string

permissions:
  contents: read

# Never cancel a production deployment once it starts.
concurrency:
  group: backend-deploy-prod
  cancel-in-progress: false

env:
  PRODUCTION_BRANCH: main
  DEPLOY_ROOT: /opt/memento/backend-prod
  READINESS_URL: http://127.0.0.1:4001/ready

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Validate
  # ────────────────────────────────────────────────────────────
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation and branch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          EXPECTED_REF="refs/heads/${PRODUCTION_BRANCH}"

          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "::error::Production deployment requires typing exactly DEPLOY"
            exit 1
          fi

          if [ "$DEPLOY_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Production deployments must come from ${PRODUCTION_BRANCH}"
            echo "::error::Selected ref: ${DEPLOY_REF}"
            exit 1
          fi

          echo "Production deployment validated."
          echo "Ref: ${DEPLOY_REF}"

  # ────────────────────────────────────────────────────────────
  # 2. Lint + test + build
  #
  # Only ONE full dependency install happens in CI.
  # ────────────────────────────────────────────────────────────
  build:
    name: Lint, Test & Build
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Verify API contract artifact
        run: yarn contracts:check

      - name: Build
        run: yarn build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "build" ]; then
            echo "::error::Build directory is missing"
            exit 1
          fi

          if [ -z "$(find build -type f -print -quit)" ]; then
            echo "::error::Build directory is empty"
            exit 1
          fi

          FILE_COUNT="$(find build -type f | wc -l | tr -d ' ')"

          echo "Build output OK — ${FILE_COUNT} files"

      # ────────────────────────────────────────────────────────
      # Create an explicit deployment artifact.
      #
      # IMPORTANT:
      #
      # The repository currently has:
      #
      #   "postinstall": "npm run compile"
      #
      # That is useful only when source + tsconfig are present.
      # Production receives already-compiled build/, therefore
      # running that application lifecycle hook on the server is
      # incorrect.
      #
      # We strip ONLY the root application's postinstall hook.
      #
      # We DO NOT use yarn --ignore-scripts, so dependency
      # packages may still run legitimate native/install scripts.
      # ────────────────────────────────────────────────────────
      - name: Prepare deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp -a build release/build
          cp package.json release/package.json
          cp yarn.lock release/yarn.lock
          cp ecosystem.config.js release/ecosystem.config.js
          cp .nvmrc release/.nvmrc
          cp .npmrc release/.npmrc
          cp openapi.json release/openapi.json
          cp openapi.sha256 release/openapi.sha256

          node <<'NODE'
          const fs = require('fs');

          const path = 'release/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (pkg.scripts?.postinstall) {
            console.log(
              `Removing application postinstall from deployment artifact: ${pkg.scripts.postinstall}`
            );

            delete pkg.scripts.postinstall;
          }

          fs.writeFileSync(
            path,
            JSON.stringify(pkg, null, 2) + '\n'
          );
          NODE

          echo
          echo "Deployment artifact contents:"
          find release -maxdepth 2 -type f | sort

          echo
          echo "Deployment scripts:"
          node -e \
            "console.log(JSON.stringify(require('./release/package.json').scripts, null, 2))"

      # Artifacts count against the account's storage quota; the Actions cache does not.
      - name: Save deployment bundle
        uses: actions/cache/save@v4
        with:
          key: backend-prod-${{ github.sha }}-${{ github.run_id }}
          path: release/

  # ────────────────────────────────────────────────────────────
  # 3. Deploy
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}

      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Restore deployment bundle
        uses: actions/cache/restore@v4
        with:
          key: backend-prod-${{ github.sha }}-${{ github.run_id }}
          path: release/
          fail-on-cache-miss: true

      # ────────────────────────────────────────────────────────
      # SSH setup
      # ────────────────────────────────────────────────────────
      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SSH_HOST" ]; then
            echo "::error::DEPLOY_SSH_HOST is missing"
            exit 1
          fi

          if [ -z "$SSH_USER" ]; then
            echo "::error::DEPLOY_SSH_USER is missing"
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY is missing"
            exit 1
          fi

          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KNOWN_HOSTS is missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connection
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection OK'"

      # ────────────────────────────────────────────────────────
      # PostHog settings: GitHub secrets -> server .env.
      # The values go to the server inside the stdin script, never
      # on a command line. The apps read them when the release is
      # activated below.
      # ────────────────────────────────────────────────────────
      - name: Sync PostHog settings
        shell: bash
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_IDENTITY_SECRET: ${{ secrets.POSTHOG_IDENTITY_SECRET_PROD }}
        run: |
          set -euo pipefail

          if [ -z "$POSTHOG_PROJECT_TOKEN" ] \
            || [ -z "$POSTHOG_HOST" ] \
            || [ -z "$POSTHOG_IDENTITY_SECRET" ]; then
            echo "::warning::PostHog secrets are not all set; the production .env was left unchanged."
            exit 0
          fi

          # Strict formats keep the values safe to embed in the script.
          if ! [[ "$POSTHOG_PROJECT_TOKEN" =~ ^phc_[A-Za-z0-9]+$ ]]; then
            echo "::error::POSTHOG_PROJECT_TOKEN must look like phc_..."
            exit 1
          fi
          if ! [[ "$POSTHOG_HOST" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::POSTHOG_HOST must be a bare https origin"
            exit 1
          fi
          if ! [[ "$POSTHOG_IDENTITY_SECRET" =~ ^[A-Za-z0-9]{32,}$ ]]; then
            echo "::error::POSTHOG_IDENTITY_SECRET_PROD must be 32+ letters or digits"
            exit 1
          fi

          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_ROOT/.env'" <<REMOTE
          set -euo pipefail
          ENV_FILE="\$1"
          if [ ! -f "\$ENV_FILE" ]; then
            echo "::error::\$ENV_FILE does not exist"
            exit 1
          fi
          TMP="\$(mktemp "\$ENV_FILE.XXXXXX")"
          trap 'rm -f "\$TMP"' EXIT
          grep -v -E '^(export )?POSTHOG_(PROJECT_TOKEN|HOST|IDENTITY_SECRET)=' \
            "\$ENV_FILE" > "\$TMP" || true
          {
            echo 'POSTHOG_PROJECT_TOKEN=$POSTHOG_PROJECT_TOKEN'
            echo 'POSTHOG_HOST=$POSTHOG_HOST'
            echo 'POSTHOG_IDENTITY_SECRET=$POSTHOG_IDENTITY_SECRET'
          } >> "\$TMP"
          if cmp -s "\$TMP" "\$ENV_FILE"; then
            echo "PostHog settings are already current."
            exit 0
          fi
          chmod --reference="\$ENV_FILE" "\$TMP"
          mv -f "\$TMP" "\$ENV_FILE"
          trap - EXIT
          echo "PostHog settings written to \$ENV_FILE."
          REMOTE

      # ────────────────────────────────────────────────────────
      # Sign in with Apple key: GitHub secrets -> server .env.
      # Used to revoke a user's Apple sign-in when they delete
      # their account (App Store Guideline 5.1.1(v)). The .p8 key
      # is flattened to one line with literal \n; the API turns
      # them back into line breaks. Values travel in the stdin
      # script, never on a command line.
      # ────────────────────────────────────────────────────────
      - name: Sync Sign in with Apple key
        shell: bash
        env:
          APPLE_SIGNIN_KEY_ID: ${{ secrets.APPLE_SIGNIN_KEY_ID }}
          APPLE_SIGNIN_PRIVATE_KEY: ${{ secrets.APPLE_SIGNIN_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_SIGNIN_KEY_ID" ] || [ -z "$APPLE_SIGNIN_PRIVATE_KEY" ]; then
            echo "::warning::Sign in with Apple secrets are not both set; the .env was left unchanged."
            exit 0
          fi

          if ! [[ "$APPLE_SIGNIN_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_SIGNIN_KEY_ID must be the 10-character Key ID"
            exit 1
          fi

          # Accept the .p8 however it was pasted: several lines, one line
          # with literal \n, wrapped in quotes, prefixed with the variable
          # name, or with the base64 run together.
          BODY="$(printf '%s' "$APPLE_SIGNIN_PRIVATE_KEY" | tr -d '\r' \
            | sed -E 's/^[[:space:]]*(export[[:space:]]+)?APPLE_SIGNIN_PRIVATE_KEY=//' \
            | sed 's/\\n/ /g' | tr '\n\t"'"'"'' '    ' \
            | sed -E 's/-----(BEGIN|END) PRIVATE KEY-----/ /g' | tr -d ' ')"
          HAS_BEGIN=no; HAS_END=no
          [[ "$APPLE_SIGNIN_PRIVATE_KEY" == *"-----BEGIN PRIVATE KEY-----"* ]] && HAS_BEGIN=yes
          [[ "$APPLE_SIGNIN_PRIVATE_KEY" == *"-----END PRIVATE KEY-----"* ]] && HAS_END=yes
          KEY_FLAT="-----BEGIN PRIVATE KEY-----"
          REST="$BODY"
          while [ -n "$REST" ]; do KEY_FLAT="$KEY_FLAT\\n${REST:0:64}"; REST="${REST:64}"; done
          KEY_FLAT="$KEY_FLAT\\n-----END PRIVATE KEY-----"

          # Strict format keeps the value safe to embed in the script, and
          # openssl confirms it is a real private key.
          if [ -z "$BODY" ] || ! [[ "$BODY" =~ ^[A-Za-z0-9+/]+=*$ ]] \
            || ! printf '%b\n' "$KEY_FLAT" | openssl pkey -noout 2>/dev/null; then
            BAD="$(printf '%s' "$BODY" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')"
            LINES="$(printf '%s\n' "$APPLE_SIGNIN_PRIVATE_KEY" | wc -l | tr -d ' ')"
            echo "::error::APPLE_SIGNIN_PRIVATE_KEY is not a complete .p8 file (lines: $LINES, BEGIN line: $HAS_BEGIN, END line: $HAS_END, key characters: ${#BODY}, characters not allowed in a key: $BAD). Open the .p8 in a plain-text editor and paste all of it."
            exit 1
          fi

          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_ROOT/.env'" <<REMOTE
          set -euo pipefail
          ENV_FILE="\$1"
          if [ ! -f "\$ENV_FILE" ]; then
            echo "::error::\$ENV_FILE does not exist"
            exit 1
          fi
          TMP="\$(mktemp "\$ENV_FILE.XXXXXX")"
          trap 'rm -f "\$TMP"' EXIT
          grep -v -E '^(export )?APPLE_SIGNIN_(KEY_ID|PRIVATE_KEY)=' \
            "\$ENV_FILE" > "\$TMP" || true
          {
            echo 'APPLE_SIGNIN_KEY_ID=$APPLE_SIGNIN_KEY_ID'
            echo 'APPLE_SIGNIN_PRIVATE_KEY=$KEY_FLAT'
          } >> "\$TMP"
          if cmp -s "\$TMP" "\$ENV_FILE"; then
            echo "Sign in with Apple key is already current."
            exit 0
          fi
          chmod --reference="\$ENV_FILE" "\$TMP"
          mv -f "\$TMP" "\$ENV_FILE"
          trap - EXIT
          echo "Sign in with Apple key written to \$ENV_FILE."
          REMOTE

      # ────────────────────────────────────────────────────────
      # Upload NEW release without touching current
      # ────────────────────────────────────────────────────────
      - name: Create release directory
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_ROOT/releases/$RELEASE_ID'"

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail

          rsync \
            -az \
            --delete \
            -e "ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -i ~/.ssh/deploy_key \
              -p $SSH_PORT" \
            ./release/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/releases/$RELEASE_ID/"

      # ────────────────────────────────────────────────────────
      # Prepare runtime BEFORE activation
      #
      # Nothing live has changed yet.
      # ────────────────────────────────────────────────────────
      - name: Prepare release runtime
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail

          RELEASE_ID="$1"

          DEPLOY_ROOT="/opt/memento/backend-prod"
          RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"

          cd "$RELEASE_DIR"

          if [ ! -f ".nvmrc" ]; then
            echo "ERROR: Release is missing .nvmrc"
            exit 1
          fi

          # Safety guard:
          # deployment package.json must not compile application
          # source during production dependency installation.
          POSTINSTALL="$(
            node -e "
              const p = require('./package.json');
              process.stdout.write(p.scripts?.postinstall || '');
            " 2>/dev/null || true
          )"

          if [ -n "$POSTINSTALL" ]; then
            echo "ERROR: Deployment package.json still contains postinstall:"
            echo "  $POSTINSTALL"
            exit 1
          fi

          export NVM_DIR="$HOME/.nvm"

          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "ERROR: NVM is not installed for the deploy user"
            exit 1
          fi

          # NVM itself is not fully compatible with nounset.
          set +u
          . "$NVM_DIR/nvm.sh"

          nvm install
          NVM_INSTALL_STATUS=$?

          if [ "$NVM_INSTALL_STATUS" -eq 0 ]; then
            nvm use
            NVM_USE_STATUS=$?
          else
            NVM_USE_STATUS=1
          fi

          set -u

          if [ "$NVM_INSTALL_STATUS" -ne 0 ]; then
            echo "ERROR: Failed installing Node version from .nvmrc"
            exit 1
          fi

          if [ "$NVM_USE_STATUS" -ne 0 ]; then
            echo "ERROR: Failed activating Node version from .nvmrc"
            exit 1
          fi

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"

          # ────────────────────────────────────────────────────
          # Yarn Classic
          # ────────────────────────────────────────────────────
          YARN_VERSION="$(yarn --version 2>/dev/null || true)"

          case "$YARN_VERSION" in
            1.*)
              echo "Yarn: ${YARN_VERSION}"
              ;;

            *)
              echo "Installing Yarn Classic..."

              if command -v corepack >/dev/null 2>&1; then
                set +e
                corepack enable
                corepack prepare yarn@1.22.22 --activate
                COREPACK_STATUS=$?
                set -e

                if [ "$COREPACK_STATUS" -ne 0 ]; then
                  npm install --global yarn@1.22.22 --force
                fi
              else
                npm install --global yarn@1.22.22 --force
              fi

              echo "Yarn: $(yarn --version)"
              ;;
          esac

          # ────────────────────────────────────────────────────
          # PM2
          #
          # NVM global packages are Node-version-specific.
          # Node 24 therefore needs its own PM2 CLI even when
          # Node 22 previously had PM2 installed.
          # ────────────────────────────────────────────────────
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "PM2 unavailable for $(node --version)"
            echo "Installing PM2..."

            npm install --global pm2
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "ERROR: PM2 unavailable after installation"
            exit 1
          fi

          echo "PM2: $(pm2 --version)"
          echo "PM2 executable: $(command -v pm2)"

          # ────────────────────────────────────────────────────
          # Runtime dependency install
          #
          # No application compile occurs here because the
          # deployment artifact has no root postinstall hook.
          #
          # Dependency package install scripts remain enabled.
          # ────────────────────────────────────────────────────
          yarn install \
            --production \
            --frozen-lockfile

          echo "Runtime dependencies installed successfully."
          REMOTE

      # ────────────────────────────────────────────────────────
      # Activate release + health check + rollback
      # ────────────────────────────────────────────────────────
      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -T \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail

          RELEASE_ID="$1"

          DEPLOY_ROOT="/opt/memento/backend-prod"
          RELEASES="$DEPLOY_ROOT/releases"
          CURRENT="$DEPLOY_ROOT/current"

          NEW_RELEASE="$RELEASES/$RELEASE_ID"

          API_APP="memento-backend-prod"
          WORKER_APP="memento-backend-prod-worker"

          READINESS_URL="http://127.0.0.1:4001/ready"

          mkdir -p "$RELEASES"

          if [ ! -d "$NEW_RELEASE" ]; then
            echo "ERROR: New release does not exist:"
            echo "  $NEW_RELEASE"
            exit 1
          fi

          # ────────────────────────────────────────────────────
          # Helpers
          # ────────────────────────────────────────────────────
          load_nvm() {
            export NVM_DIR="$HOME/.nvm"

            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "ERROR: NVM is unavailable"
              return 1
            fi

            set +u
            . "$NVM_DIR/nvm.sh"
            STATUS=$?
            set -u

            return "$STATUS"
          }

          use_release_node() {
            RELEASE_DIR="$1"

            if ! load_nvm; then
              return 1
            fi

            OLD_PWD="$PWD"
            cd "$RELEASE_DIR"

            if [ -f ".nvmrc" ]; then
              echo "Selecting Node from:"
              echo "  $RELEASE_DIR/.nvmrc"

              set +u
              nvm use
              NVM_STATUS=$?
              set -u
            else
              # Old pre-release-layout deployments may not have
              # included .nvmrc.
              echo "WARNING: Legacy release has no .nvmrc:"
              echo "  $RELEASE_DIR"

              echo "Trying NVM default..."

              set +u
              nvm use default >/dev/null 2>&1
              NVM_STATUS=$?
              set -u

              if [ "$NVM_STATUS" -ne 0 ]; then
                echo "NVM default unavailable."
                NVM_STATUS=0
              fi
            fi

            cd "$OLD_PWD"

            if [ "$NVM_STATUS" -ne 0 ]; then
              echo "ERROR: Unable to select Node version"
              return 1
            fi

            if ! command -v node >/dev/null 2>&1; then
              echo "ERROR: Node unavailable"
              return 1
            fi

            # Legacy fallback:
            #
            # If the legacy/default Node installation doesn't
            # contain PM2, use the new release's Node version.
            #
            # That Node version was guaranteed to have PM2
            # installed during Prepare release runtime.
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 unavailable under current Node."
              echo "Trying deployment Node as PM2 control runtime..."

              cd "$NEW_RELEASE"

              set +u
              nvm use >/dev/null 2>&1
              FALLBACK_STATUS=$?
              set -u

              cd "$OLD_PWD"

              if [ "$FALLBACK_STATUS" -ne 0 ]; then
                echo "ERROR: Could not select deployment Node"
                return 1
              fi
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: PM2 unavailable"
              return 1
            fi

            echo "Control Node: $(node --version)"
            echo "PM2: $(command -v pm2)"

            return 0
          }

          switch_release() {
            TARGET="$1"

            if [ ! -d "$TARGET" ]; then
              echo "ERROR: Cannot activate missing release:"
              echo "  $TARGET"
              return 1
            fi

            rm -f "$DEPLOY_ROOT/.current-next"

            ln -s \
              "$TARGET" \
              "$DEPLOY_ROOT/.current-next"

            # Atomic replacement on the same filesystem.
            mv -Tf \
              "$DEPLOY_ROOT/.current-next" \
              "$CURRENT"
          }

          reload_apps() {
            cd "$DEPLOY_ROOT"

            echo "Reloading production PM2 applications..."

            # API
            if pm2 describe "$API_APP" >/dev/null 2>&1; then
              pm2 reload \
                "$API_APP" \
                --update-env
            else
              echo "$API_APP is not registered; starting from ecosystem config."

              MEMENTO_ENV=prod \
                pm2 start \
                "$DEPLOY_ROOT/ecosystem.config.js" \
                --only "$API_APP"
            fi

            # Worker
            if pm2 describe "$WORKER_APP" >/dev/null 2>&1; then
              pm2 reload \
                "$WORKER_APP" \
                --update-env
            else
              echo "$WORKER_APP is not registered; starting from ecosystem config."

              MEMENTO_ENV=prod \
                pm2 start \
                "$DEPLOY_ROOT/ecosystem.config.js" \
                --only "$WORKER_APP"
            fi

            pm2 save

            echo "PM2 reload completed."
          }

          run_release_migrations() {
            echo "Running release database migrations..."
            cd "$NEW_RELEASE"
            MIGRATION_STATUS=0
            DOTENV_CONFIG_PATH="$DEPLOY_ROOT/.env" \
              NODE_ENV=production \
              MEMENTO_ENV=prod \
              npm run migrations:up:prod || MIGRATION_STATUS=$?
            cd "$DEPLOY_ROOT"
            return "$MIGRATION_STATUS"
          }

          check_readiness() {
            LABEL="$1"
            ATTEMPTS="${2:-15}"
            ALLOW_LEGACY_HEALTH="${3:-0}"

            echo "Checking ${LABEL}..."

            for attempt in $(seq 1 "$ATTEMPTS"); do
              READINESS_STATUS="$(curl \
                --silent \
                --max-time 5 \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$READINESS_URL" \
                2>/dev/null || true)"

              case "$READINESS_STATUS" in
              2??)
                echo "${LABEL} passed on attempt ${attempt}"
                return 0
                ;;
              esac

              if [ "$ALLOW_LEGACY_HEALTH" = "1" ] && \
                { [ "$READINESS_STATUS" = "404" ] || \
                  [ "$READINESS_STATUS" = "405" ]; } && curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                "${READINESS_URL%/ready}/health" \
                >/dev/null 2>&1
              then
                echo "${LABEL} passed via legacy health endpoint on attempt ${attempt}"
                return 0
              fi

              echo "${LABEL} attempt ${attempt} failed"
              sleep 2
            done

            echo "${LABEL} failed"
            return 1
          }

          # ────────────────────────────────────────────────────
          # First-time migration from old in-place deployment
          # ────────────────────────────────────────────────────
          if [ ! -L "$CURRENT" ]; then
            if [ -e "$CURRENT" ]; then
              echo "ERROR: $CURRENT exists but is not a symlink"
              exit 1
            fi

            LEGACY_RELEASE="$RELEASES/legacy-$(date +%Y%m%d-%H%M%S)"
            LEGACY_FOUND=0

            mkdir -p "$LEGACY_RELEASE"

            for item in \
              build \
              node_modules \
              package.json \
              yarn.lock \
              ecosystem.config.js \
              .nvmrc
            do
              if [ -e "$DEPLOY_ROOT/$item" ] || \
                 [ -L "$DEPLOY_ROOT/$item" ]; then

                mv \
                  "$DEPLOY_ROOT/$item" \
                  "$LEGACY_RELEASE/$item"

                LEGACY_FOUND=1
              fi
            done

            if [ "$LEGACY_FOUND" -eq 1 ]; then
              echo "Migrated existing deployment to:"
              echo "  $LEGACY_RELEASE"

              ln -s \
                "$LEGACY_RELEASE" \
                "$CURRENT"
            else
              echo "No previous deployment found."
              rmdir "$LEGACY_RELEASE"
            fi

            # Compatibility paths allow the existing
            # ecosystem.config.js to continue referencing:
            #
            # /opt/memento/backend-prod/build/...
            #
            # even though the actual build lives in:
            #
            # releases/<id>/build/
            ln -sfn \
              "current/build" \
              "$DEPLOY_ROOT/build"

            ln -sfn \
              "current/node_modules" \
              "$DEPLOY_ROOT/node_modules"

            ln -sfn \
              "current/package.json" \
              "$DEPLOY_ROOT/package.json"

            ln -sfn \
              "current/yarn.lock" \
              "$DEPLOY_ROOT/yarn.lock"

            ln -sfn \
              "current/ecosystem.config.js" \
              "$DEPLOY_ROOT/ecosystem.config.js"

            ln -sfn \
              "current/.nvmrc" \
              "$DEPLOY_ROOT/.nvmrc"
          fi

          # ────────────────────────────────────────────────────
          # Validate release layout
          # ────────────────────────────────────────────────────
          if [ ! -L "$CURRENT" ]; then
            echo "ERROR: current is not a symlink"
            exit 1
          fi

          if [ ! -L "$DEPLOY_ROOT/build" ]; then
            echo "ERROR: build compatibility symlink is missing"
            exit 1
          fi

          if [ ! -L "$DEPLOY_ROOT/ecosystem.config.js" ]; then
            echo "ERROR: ecosystem.config.js compatibility symlink is missing"
            exit 1
          fi

          PREVIOUS_RELEASE="$(
            readlink -f "$CURRENT" || true
          )"

          echo
          echo "Previous release:"
          echo "  ${PREVIOUS_RELEASE:-none}"

          echo "New release:"
          echo "  $NEW_RELEASE"

          # Set to 1 immediately before calling PM2.
          #
          # PM2 may partially reload one process and then fail,
          # so rollback must assume processes were touched once
          # the operation begins.
          PM2_RELOAD_ATTEMPTED=0

          rollback() {
            echo
            echo "Production deployment failed."

            if [ -z "$PREVIOUS_RELEASE" ]; then
              echo "ERROR: No previous release available."
              return 1
            fi

            if [ ! -d "$PREVIOUS_RELEASE" ]; then
              echo "ERROR: Previous release no longer exists:"
              echo "  $PREVIOUS_RELEASE"
              return 1
            fi

            echo "Restoring current symlink:"
            echo "  $PREVIOUS_RELEASE"

            if ! switch_release "$PREVIOUS_RELEASE"; then
              echo "ERROR: Failed restoring previous symlink."
              return 1
            fi

            # If PM2 wasn't touched, the original production
            # processes are still running. Reloading them would
            # only introduce another possible failure.
            if [ "$PM2_RELOAD_ATTEMPTED" -eq 0 ]; then
              echo "PM2 was not modified."
              echo "Existing production processes remain running."
              echo "Symlink rollback completed."
              return 0
            fi

            echo "PM2 was modified; reloading previous release..."

            if ! use_release_node "$PREVIOUS_RELEASE"; then
              echo "ERROR: Symlink restored but PM2 control runtime failed."
              return 1
            fi

            if ! reload_apps; then
              echo "ERROR: Symlink restored but PM2 rollback failed."
              return 1
            fi

            if ! check_readiness "Rollback readiness check" 15 1; then
              echo "ERROR: Previous release restored but readiness check failed."
              return 1
            fi

            echo "Production rollback completed successfully."
            return 0
          }

          # ────────────────────────────────────────────────────
          # Activate
          # ────────────────────────────────────────────────────
          echo
          echo "Activating new production release..."

          # This should succeed because Prepare release runtime
          # already provisioned Node + PM2 before activation.
          if ! use_release_node "$NEW_RELEASE"; then
            exit 1
          fi

          if ! run_release_migrations; then
            echo "ERROR: Release database migrations failed."
            exit 1
          fi

          if ! switch_release "$NEW_RELEASE"; then
            echo "ERROR: Failed activating new release."
            exit 1
          fi

          PM2_RELOAD_ATTEMPTED=1

          if ! reload_apps; then
            rollback || true
            exit 1
          fi

          # ────────────────────────────────────────────────────
          # Readiness check
          # ────────────────────────────────────────────────────
          if ! check_readiness "Production readiness check" 15; then
            rollback || true
            exit 1
          fi

          echo
          echo "Production deployment successful."
          echo "Active release:"
          echo "  $NEW_RELEASE"

          # Growth analytics settings: warn (never fail) when PostHog
          # tracking is off or mis-tagged, so signups can't go missing silently.
          (
            cd "$NEW_RELEASE" &&
              DOTENV_CONFIG_PATH="$DEPLOY_ROOT/.env" \
              NODE_ENV=production \
              MEMENTO_ENV=prod \
              node build/src/scripts/growth-analytics/check-config.js --github
          ) || echo "::warning::Could not check growth analytics settings"

          # ────────────────────────────────────────────────────
          # Cleanup
          #
          # Keep latest 5 normal releases.
          # Keep legacy releases as an additional migration
          # safety net.
          # ────────────────────────────────────────────────────
          mapfile -t OLD_RELEASES < <(
            find "$RELEASES" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              ! -name 'legacy-*' \
              -printf '%T@ %p\n' \
              | sort -rn \
              | awk '
                  NR > 5 {
                    $1 = ""
                    sub(/^ /, "")
                    print
                  }
                '
          )

          ACTIVE_RELEASE="$(
            readlink -f "$CURRENT" || true
          )"

          for old_release in "${OLD_RELEASES[@]}"; do
            if [ "$old_release" = "$ACTIVE_RELEASE" ]; then
              continue
            fi

            echo "Removing old release:"
            echo "  $old_release"

            rm -rf "$old_release"
          done
          REMOTE

      - name: Cleanup SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/known_hosts

  # ────────────────────────────────────────────────────────────
  # 4. Always notify
  #
  # Separate from deploy so validation/build failures are
  # reported too.
  # ────────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs:
      - validate
      - build
      - deploy

    if: ${{ always() }}
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      VALIDATE_RESULT: ${{ needs.validate.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}

      COMMIT_SHA: ${{ github.sha }}
      BRANCH: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}

      SERVER_URL: ${{ github.server_url }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Discord notification
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping."
            exit 0
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
          COMMIT_URL="${SERVER_URL}/${REPOSITORY}/commit/${COMMIT_SHA}"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="✅ Prod Deploy Succeeded"
            COLOR=3066993
            STATUS="Success"

          elif [ "$VALIDATE_RESULT" = "failure" ]; then
            TITLE="⛔ Prod Deploy Rejected"
            COLOR=16753920
            STATUS="Rejected"

          elif [ "$BUILD_RESULT" = "failure" ]; then
            TITLE="❌ Prod Build Failed"
            COLOR=15158332
            STATUS="Build failed"

          else
            TITLE="❌ Prod Deploy Failed"
            COLOR=15158332
            STATUS="Deploy failed"
          fi

          PAYLOAD="$(
            jq -n \
              --arg title "$TITLE" \
              --argjson color "$COLOR" \
              --arg status "$STATUS" \
              --arg branch "$BRANCH" \
              --arg sha "$SHORT_SHA" \
              --arg commit_url "$COMMIT_URL" \
              --arg actor "$ACTOR" \
              --arg run_url "$RUN_URL" \
              --arg validate "$VALIDATE_RESULT" \
              --arg build "$BUILD_RESULT" \
              --arg deploy "$DEPLOY_RESULT" \
              --arg timestamp "$TIMESTAMP" \
              '{
                embeds: [{
                  title: $title,
                  color: $color,
                  fields: [
                    {
                      name: "Environment",
                      value: "Production",
                      inline: true
                    },
                    {
                      name: "Status",
                      value: $status,
                      inline: true
                    },
                    {
                      name: "Branch",
                      value: ("`" + $branch + "`"),
                      inline: true
                    },
                    {
                      name: "Commit",
                      value: (
                        "[`" + $sha + "`](" +
                        $commit_url +
                        ")"
                      ),
                      inline: true
                    },
                    {
                      name: "Triggered by",
                      value: $actor,
                      inline: true
                    },
                    {
                      name: "Workflow",
                      value: (
                        "[View run](" +
                        $run_url +
                        ")"
                      ),
                      inline: true
                    },
                    {
                      name: "Pipeline",
                      value: (
                        "Validate: `" + $validate +
                        "`\nBuild: `" + $build +
                        "`\nDeploy: `" + $deploy +
                        "`"
                      ),
                      inline: false
                    }
                  ],
                  timestamp: $timestamp
                }]
              }'
          )"

          curl \
            --fail \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" \
            || true
