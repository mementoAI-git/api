version: '3.8'

services:
  redis:
    image: redis:7
    container_name: memento-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - memento-network

volumes:
  redis_data:

networks:
  memento-network:
    driver: bridge